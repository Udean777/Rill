name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (automatically calculated from latest tag)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version string (only if bump_type is custom, e.g., 1.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then
            echo "Selecting $xcode"
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"

          echo "Latest tag found: '$LATEST_TAG'"
          echo "Selected bump type: '$BUMP_TYPE'"

          if [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_INPUT" ]; then
            CLEAN_VERSION="${CUSTOM_INPUT#v}"
          elif [ -z "$LATEST_TAG" ]; then
            # Initial release if no tag found in repository
            CLEAN_VERSION="1.0.0"
          else
            CLEAN="${LATEST_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            case "$BUMP_TYPE" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${CLEAN_VERSION}"
          echo "Computed new version: $CLEAN_VERSION"
          echo "Computed tag: $TAG_NAME"

          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Verify Tag Does Not Already Exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists!"
            exit 1
          fi

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project Rill.xcodeproj \
            -scheme Rill \
            -configuration Release \
            -archivePath $PWD/build/Rill.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Bundle Invariants
        run: |
          APP="build/Rill.xcarchive/Products/Applications/Rill.app"
          test -d "$APP"
          # Invariant 1: App never activates (LSUIElement = YES per design.md §5.3 and AGENTS.md §1.1)
          plutil -p "$APP/Contents/Info.plist" | grep -q '"LSUIElement" => true'
          # Invariant 2: Target frameworks are properly embedded
          test -d "$APP/Contents/Frameworks/RillDomain.framework"
          test -d "$APP/Contents/Frameworks/RillData.framework"
          test -d "$APP/Contents/Frameworks/RillUI.framework"
          test -d "$APP/Contents/Frameworks/RillPlatform.framework"

      - name: Import Signing Certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::SIGNING_CERT_P12 is not set; falling back to ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)"/\1/p' | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::Signing certificate imported but no codesigning identity was found."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Code Sign
        run: |
          APP_PATH="build/Rill.xcarchive/Products/Applications/Rill.app"
          IDENTITY="${{ steps.signing.outputs.identity }}"
          if [ "$IDENTITY" = "-" ]; then
            echo "::warning::Signing ad-hoc."
          fi

          # Sign embedded frameworks inside Contents/Frameworks first
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            for fw in "$APP_PATH/Contents/Frameworks"/*.framework; do
              if [ -d "$fw" ]; then
                echo "Signing $fw"
                codesign --force -s "$IDENTITY" "$fw"
              fi
            done
          fi

          echo "Signing $APP_PATH"
          codesign --force -s "$IDENTITY" "$APP_PATH"
          codesign -vvv --deep --strict "$APP_PATH"

          echo "Designated requirement:"
          codesign -d -r- "$APP_PATH" 2>&1 | tail -n 1

      - name: Create DMG Installer
        run: |
          APP_PATH="build/Rill.xcarchive/Products/Applications/Rill.app"
          DMG_NAME="Rill-${{ steps.version.outputs.version }}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

          STAGING="build/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/Rill.app"
          ln -s /Applications "$STAGING/Applications"

          # Native hdiutil replaces create-dmg: no Finder AppleScript or deprecated
          # -fsargs, which are the parts that fail on non-GUI CI runners.
          hdiutil create \
            -volname "Rill Installer" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_NAME"

          hdiutil verify "$DMG_NAME"

      - name: Generate Checksums
        run: |
          shasum -a 256 "${{ env.DMG_NAME }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Install Guide
        run: |
          cat << 'EOF' > INSTALL_GUIDE.txt
          =========================================================
          Rill Installation Guide (macOS)
          =========================================================

          1. Open the downloaded DMG installer file.
          2. Drag & drop "Rill.app" into your "Applications" folder.
          3. If macOS displays a Gatekeeper alert ("Rill cannot be opened because Apple cannot check it for malicious software" or "damaged"):
             - Open Terminal (Cmd + Space, type "Terminal")
             - Run the following command:
                 xattr -cr /Applications/Rill.app
          4. Launch Rill from Launchpad or Applications.
          =========================================================
          EOF

      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rill ${{ steps.version.outputs.tag }}
          files: |
            ${{ env.DMG_NAME }}
            SHA256SUMS.txt
            INSTALL_GUIDE.txt
          generate_release_notes: true
